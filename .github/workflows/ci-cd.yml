name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============ Бэкенд тесты и линтинг ============
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: text_cards
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov

      - name: Run linting (flake8)
        run: |
          cd back
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/text_cards
          SECRET_KEY: test-secret-key
          S3_BUCKET: test-bucket
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_REGION: us-east-1
          WEATHER_API_KEY: test-key
          WEATHER_API_URL: http://api.openweathermap.org/data/2.5/weather
        run: |
          cd back
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./back/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ============ Фронтенд тесты и линтинг ============
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front/package-lock.json'

      - name: Install dependencies
        run: |
          cd front
          npm ci

      - name: Run linting (ESLint)
        run: |
          cd front
          npm run lint || truе

      - name: Run tests
        run: |
          cd front
          npm run test:unit -- --coverage --watchAll=false

      - name: Run E2E tests
        run: |
          cd front
          npm run eject:test || true
          npm run test:e2e || true

  # ============ Сборка Docker образов ============
  build-docker-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/dockerfile
          push: false
          tags: fullstack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/dockerfile
          push: false
          tags: fullstack-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ Проверка конфигурации Docker Compose ============
  docker-compose-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker-compose config > /dev/null || exit 1
          echo "✓ docker-compose.yml is valid"

  # ============ Развертывание (только на main) ============
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-docker-images, docker-compose-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Это пример. Необходимо настроить под вашу инфраструктуру
          echo "Deployment configuration needed"
          echo "Set the following secrets in GitHub:"
          echo "  - DEPLOY_KEY (SSH private key)"
          echo "  - DEPLOY_HOST (Server hostname or IP)"
          echo "  - DEPLOY_USER (SSH username)"
          echo "  - DEPLOY_PATH (Path on server)"
